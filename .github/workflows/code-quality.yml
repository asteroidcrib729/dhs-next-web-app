name: Code quality

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  RESEND_API_KEY: ""

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  postgresql:
    name: PostgreSQL migration and CRUD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_TEST_ALLOW_WRITE: "true"
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start isolated PostgreSQL with ephemeral credentials
        shell: bash
        run: |
          database_password="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
          auth_secret="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
          echo "::add-mask::$database_password"
          echo "::add-mask::$auth_secret"
          {
            printf 'DATABASE_URL=postgresql://postgres:%s@127.0.0.1:5432/dhs_ci\n' "$database_password"
            printf 'BETTER_AUTH_SECRET=%s\n' "$auth_secret"
          } >> "$GITHUB_ENV"
          POSTGRES_PASSWORD="$database_password" docker run --detach --name dhs-ci-postgres \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD --env POSTGRES_DB=dhs_ci \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -U postgres -d dhs_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 20 \
            postgres:18-alpine
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' dhs-ci-postgres)"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs dhs-ci-postgres
          exit 1
      - run: npm ci --no-audit --no-fund
      - run: npm run db:deploy
      - run: npm run db:drift
      - run: npm run db:check
      - run: npm run studio:check
      - name: Remove disposable database
        if: always()
        run: docker rm --force --volumes dhs-ci-postgres

  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
