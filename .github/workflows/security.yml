name: Security

on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record the complete dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/dependency-audit.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat "$RUNNER_TEMP/dependency-audit.json"
            exit "$status"
          fi
          node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/dependency-audit.json", "utf8")); if (!report.metadata) process.exit(1); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Full dependency audit: " + JSON.stringify(report.metadata.vulnerabilities) + "\n\nProduction high/critical vulnerabilities are blocking. Development findings are included in the audit artifact for review.\n");'
      - name: Block high and critical production vulnerabilities
        run: npm run security:audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan repository history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
